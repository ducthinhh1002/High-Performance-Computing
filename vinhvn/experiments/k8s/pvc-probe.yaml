# Thử cấp PVC 1Gi để chẩn đoán VAST CSI. Không dùng GPU. Xoá sau khi có kết quả.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-probe-1gi
  namespace: hpc-dl-exp
spec:
  accessModes: [ReadWriteMany]
  storageClassName: storageclass-20k
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-probe
  namespace: hpc-dl-exp
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 900
  containers:
    - name: probe
      image: busybox:1.36
      command: ["sh", "-c", "df -h /mnt && echo ok > /mnt/probe && cat /mnt/probe"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - {name: v, mountPath: /mnt}
  volumes:
    - name: v
      persistentVolumeClaim:
        claimName: pvc-probe-1gi
