# ServiceAccount chỉ có quyền trong namespace hpc-dl-exp.
# Dùng kubeconfig của SA này cho mọi thao tác hằng ngày thay vì token cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hpc-runner
  namespace: hpc-dl-exp
---
apiVersion: v1
kind: Secret
metadata:
  name: hpc-runner-token
  namespace: hpc-dl-exp
  annotations:
    kubernetes.io/service-account.name: hpc-runner
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hpc-runner
  namespace: hpc-dl-exp
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, pods/portforward, configmaps, persistentvolumeclaims, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hpc-runner
  namespace: hpc-dl-exp
subjects:
  - kind: ServiceAccount
    name: hpc-runner
    namespace: hpc-dl-exp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hpc-runner
